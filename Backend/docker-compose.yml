services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: pulverizer-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - timescale_data:/var/lib/postgresql
      - ./db_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescale_data: